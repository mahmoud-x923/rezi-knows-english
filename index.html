<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezi Knows English</title>
  <meta name="theme-color" content="#fff5f9">
  <!-- The app has its own light and dark themes, so browsers and extensions shouldn't darken it. -->
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <script>
    // Applies a chosen theme before the page draws, so dark mode doesn't flash light.
    try {
      var theme = localStorage.getItem('rezi-knows-english:theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (error) {}
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-48.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Vazirmatn:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" tabindex="-1"></main>
  <noscript>This site needs JavaScript to work.</noscript>
</body>
</html>
